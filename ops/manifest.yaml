# DATETIME of last agent review: 16 Aug 2026 15:51 (Europe/London)

project:
  name: 111 Timer
  type: wow-addon
  summary: A World of Warcraft 3.3.5a addon that reminds players about tasks after a configurable amount of active play.

read_next:
  testing: ops/TESTING.md
  security: ops/SECURITY_REVIEW.md
  agent_domain: docs/agents/domain.md

entrypoints:
  app:
    - path: 111timer.lua
      role: Addon event handling, timer state, settings, and user interface
  workers: []

runtime:
  services: []
  timers: []
  env_files: []
  state_paths:
    - OneElevenTimerDB (WoW SavedVariables)
  health_checks: []

data:
  stores:
    - WoW SavedVariables: account-wide settings and window positions
  key_runtime_tables:
    - OneElevenTimerDB

testing:
  default_commands:
    - npx --yes --package=fengari-node-cli fengari tests/test.lua

open_on_demand:
  - ops/TESTING.md

gotchas:
  - Timer progress is session-only and resets to the configured default on PLAYER_LOGIN.
  - Idle time does not count after the 15-second activity tail expires.
  - Reminders are hidden or deferred during combat and shown after combat ends.
  - The repository must be installed as a folder named 111timer for ADDON_LOADED handling.
